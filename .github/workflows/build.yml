name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract Project ZIP
      run: unzip -o *.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix gradlew script
      run: |
        find . -name gradlew -exec sed -i 's/DEFAULT_JVM_OPTS=.*/DEFAULT_JVM_OPTS=""/' {} \;
        find . -name gradlew -exec chmod +x {} \;

    - name: Build Debug APK
      run: |
        GRADLEW=$(find . -name gradlew | head -n 1)
        DIR=$(dirname "$GRADLEW")
        cd "$DIR"
        ./gradlew assembleDebug --no-daemon

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ALION-GameBooster-Debug
        path: '**/app/build/outputs/apk/debug/*.apk'
